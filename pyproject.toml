[project]
name = "reels-engine"
version = "0.1.0"
description = "Automated tech-explainer Reels engine (Phase 1 starter)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "tenacity>=8.2",
    "httpx>=0.27",
    "typer>=0.9",
    "Pillow>=10.0",
    "imageio-ffmpeg>=0.5.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
llm = ["anthropic>=0.40", "openai>=1.0"]

[project.scripts]
reels = "reels.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
